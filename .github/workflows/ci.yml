name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet "pytest>=8,<9" "pillow>=10.1,<13"
      - name: publish checks (the gate's pattern classes, no personal values)
        run: bash tests/publish-checks.sh --root .
      - name: tests (everything that does not need Apple Vision, a live browser, or the claude CLI)
        run: bash tests/run.sh -m "not macos and not live and not claude"
      - name: quickstart on the fixture
        run: bash quickstart.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet "pytest>=8,<9" "pillow>=10.1,<13" "pyobjc-framework-Vision>=10,<12" "pyobjc-framework-Quartz>=10,<12"
      - name: tests incl. Apple Vision OCR on the fixture pages
        run: bash tests/run.sh -m "not live and not claude"
      - name: quickstart with real OCR
        run: OCR_ENGINE=vision bash quickstart.sh
