<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520"
     role="img" aria-labelledby="awyr-title awyr-desc">
  <title id="awyr-title">apply-what-you-read: marks in three channels become one cited lesson a day</title>
  <desc id="awyr-desc">Pipeline diagram. Highlights arrive from an e-reader, photographed pages read by local OCR, and a notes folder. They are normalized and merged into one plain-markdown corpus per book, then built into one vault node per book. Three readers use that corpus: Praxis lists what you marked and never used, Tutor sends one cited lesson a day, and Librarian matches marked ideas against later evidence. Every stage cites the passage it used, and nothing is uploaded.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="44" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">APPLY-WHAT-YOU-READ · PIPELINE</text>
  <text x="40" y="76" fill="#2d3142" font-size="28" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">The mark you made becomes the lesson you get.</text>
  <text x="40" y="100" fill="#4f5d75" font-size="12" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif">Every stage cites the passage it used, so you can call its bluff in ten seconds.</text>
